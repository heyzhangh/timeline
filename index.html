<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:," />
<title>时间线</title>
<style>
  :root{
    --bg:#f6f7f8; --surface:#ffffff; --surface2:#f1f3f5; --border:#e2e5e9; --border-strong:#d1d5db;
    --text:#111827; --muted:#6b7280; --muted2:#9ca3af;
    --gray:#6b7280; --gray-bg:#e5e7eb; --gray-dark:#4b5563;
    --blue:#2563eb; --blue-bg:#dbeafe; --blue-dark:#1e40af;
    --orange:#ea580c; --orange-bg:#ffedd5; --orange-dark:#9a3412;
    --today:#dc2626;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --surface:#171a21; --surface2:#1e222c; --border:#262b36; --border-strong:#343b4a;
      --text:#f3f4f6; --muted:#9ca3af; --muted2:#6b7280;
      --gray:#9ca3af; --gray-bg:#374151; --gray-dark:#d1d5db;
      --blue:#60a5fa; --blue-bg:#1e3a5f; --blue-dark:#bfdbfe;
      --orange:#fb923c; --orange-bg:#431407; --orange-dark:#fed7aa;
      --today:#f87171;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 28px}
  @media(min-width:768px){.wrap{padding:28px 24px 36px}}

  /* Password gate (generic chrome only; no content lives here) */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
  .gate-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;max-width:340px;width:100%;text-align:center}
  .gate-box h2{font-size:18px;margin:0 0 16px}
  .gate-box input{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text);outline:none}
  .gate-box button{width:100%;margin-top:12px;padding:11px;font-size:15px;font-weight:700;border:none;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
  .gate-box button:active{opacity:.85}
  #err{color:var(--today);font-size:13px;min-height:18px;margin:10px 0 0}

  /* Header */
  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
  h1{font-size:28px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.02em;font-weight:800}
  @media(min-width:768px){h1{font-size:34px}}
  .subtitle{font-size:15px;line-height:1.6;color:var(--muted);max-width:680px}
  .snapshot{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .snapshot i{width:8px;height:8px;border-radius:50%;background:#16a34a;display:block;flex:none}
  .snapshot span{color:var(--muted);font-weight:500}

  /* Key takeaways */
  .keys{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0 18px}
  @media(min-width:720px){.keys{grid-template-columns:1fr 1fr 1fr}}
  .key{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .key b{display:block;font-size:14px;margin-bottom:4px}
  .key p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
  .key .num{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}

  /* Legend */
  .legend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:13px}
  .legend-item{display:flex;align-items:center;gap:7px;font-weight:600}
  .swatch{width:22px;height:10px;border-radius:999px;flex:none}
  .swatch.gray{background:var(--gray)} .swatch.blue{background:var(--blue)} .swatch.orange{background:var(--orange)}
  .diamond{width:11px;height:11px;transform:rotate(45deg);flex:none;border:2px solid var(--surface)}
  .diamond.blue{background:var(--blue)} .diamond.orange{background:var(--orange)} .diamond.gray{background:var(--gray)}
  .today-key{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:500}
  .today-line-sample{width:2px;height:18px;background:var(--today);flex:none}

  /* Scenario switcher (dynamic mode only; preview, never persisted) */
  .scenario{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:13px}
  .scenario-label{font-weight:800}
  .sc-btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .sc-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .scenario-note{color:var(--muted);font-weight:500}
  .strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:13px;font-weight:600}
  .notes-body{padding:4px 16px 16px}
  .note-item{padding:12px 0;border-bottom:1px solid var(--border)}
  .note-item:last-child{border-bottom:none}
  .note-item b{display:block;font-size:14px;margin-bottom:4px}
  .note-item p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}

  /* Gantt card */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
  .card-head strong{font-size:15px}
  .card-head span{font-size:13px;color:var(--muted)}
  .scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{height:8px}
  .scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px}
  .gantt{min-width:980px;position:relative}
  @media(min-width:1100px){.gantt{min-width:100%}}

  /* Axis */
  .axis{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--border);background:var(--surface2)}
  .axis-left{padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);border-right:1px solid var(--border);display:flex;align-items:center}
  .axis-track{position:relative;height:44px}
  .month{position:absolute;top:0;height:100%;border-left:1px solid var(--border);padding:6px 0 0 8px}
  .month:first-child{border-left:none}
  .month b{display:block;font-size:12px;line-height:1}
  .month span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .month.major b{color:var(--text)}

  /* Groups & rows */
  .group-head{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
  .group-head:first-child{border-top:none}
  .group-label{padding:9px 14px;font-size:12.5px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:8px;border-right:1px solid var(--border)}
  .group-label small{font-weight:600;color:var(--muted);letter-spacing:0}
  .group-track{background:var(--surface2);position:relative}
  .group-note{padding:10px 14px;font-size:12.5px;line-height:1.5;color:var(--muted);border-bottom:1px solid var(--border)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.gray{background:var(--gray)} .dot.blue{background:var(--blue)} .dot.orange{background:var(--orange)}

  .row{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row-info{padding:10px 14px;border-right:1px solid var(--border);min-width:0}
  .row-title{font-size:14px;font-weight:700;line-height:1.35}
  .row-dates{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row-note{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:5px}
  .row-track{position:relative;min-height:56px}
  .gridlines{position:absolute;inset:0;pointer-events:none}
  .gridlines i{position:absolute;top:0;bottom:0;width:1px;background:var(--border);opacity:.7}
  .bar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:999px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:22px}
  .bar.gray{background:var(--gray)} .bar.blue{background:var(--blue)} .bar.orange{background:var(--orange)}
  .bar-label-out{position:absolute;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;white-space:nowrap;padding-left:8px}
  .node{position:absolute;top:50%;width:16px;height:16px;transform:translate(-50%,-50%) rotate(45deg);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18);z-index:3}
  .node.gray{background:var(--gray)} .node.blue{background:var(--blue)} .node.orange{background:var(--orange)}
  .node-label{position:absolute;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;white-space:nowrap}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:4;pointer-events:none}
  .today-tag{position:absolute;top:6px;transform:translateX(-50%);background:var(--today);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;white-space:nowrap;z-index:5}

  /* Status: dimmed rows for void items, small tag for non-default states */
  .group-head.void,.row.void{opacity:.45}
  .status-tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);vertical-align:2px;white-space:nowrap}

  /* Links card (rendered only when the payload carries links) */
  .links{list-style:none;margin:0;padding:0}
  .links li{padding:12px 16px;border-bottom:1px solid var(--border)}
  .links li:last-child{border-bottom:none}
  .links a{font-weight:700}
  .links p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}

  .hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0;display:flex;gap:6px;align-items:center}
  .hint::before{content:"↔";font-weight:800}

  .footer{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .footer p{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
  .footer strong{color:var(--text)}
  .meta{margin-top:12px;font-size:12.5px;color:var(--muted2);text-align:center}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <h2>请输入访问密码</h2>
    <input type="password" id="pw" placeholder="访问密码" autocomplete="off" />
    <button id="go">进入</button>
    <p id="err"></p>
  </div>
</div>
<div id="content" style="display:none"><div class="wrap" id="wrap"></div></div>
<script>
(function(){
  var DAY = 86400000;

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function parseDate(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function dayDiff(a, b){ return Math.round((b - a)/DAY); }
  function fmtSlash(s){ return s.replace(/-/g,'/'); }
  function fmtCN(s){ var p = s.split('-'); return (+p[0])+'年'+(+p[1])+'月'+(+p[2])+'日'; }
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function monthYear(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'; }
  function b64ToBytes(s){ var bin = atob(s), arr = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++){ arr[i]=bin.charCodeAt(i); } return arr; }
  function addDaysIso(s, n){ var d = parseDate(s); d.setDate(d.getDate()+n); return isoOf(d); }
  function addMonthsIso(s, n){
    var d = parseDate(s);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth()+n);
    var last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, last));
    return isoOf(d);
  }

  /* ---------------- Legacy render: payloads without exam.json ----------------
     Kept byte-identical in behavior to the previous shell so the live page
     does not change at all during the shell-first deployment step. */
  function renderLegacy(meta, tasks){
    // Axis: earliest start minus 7 days, latest end plus 7 days.
    var minStart = null, maxEnd = null;
    tasks.forEach(function(t){
      var s = parseDate(t.start);
      var e = t.kind === 'node' ? s : parseDate(t.end);
      if(!minStart || s < minStart) minStart = s;
      if(!maxEnd || e > maxEnd) maxEnd = e;
    });
    var axisStart = new Date(minStart.getTime() - 7*DAY);
    var axisEnd = new Date(maxEnd.getTime() + 7*DAY);
    var TOTAL = dayDiff(axisStart, axisEnd) + 1;
    function pct(d){ return dayDiff(axisStart, d)/TOTAL*100; }

    // Today line, from the viewer's local clock. Drawn only inside the axis.
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var todayIn = today >= axisStart && today <= axisEnd;
    var todayPct = todayIn ? pct(today) : 0;

    var months = [];
    var y = axisStart.getFullYear(), m = axisStart.getMonth();
    var ey = axisEnd.getFullYear(), em = axisEnd.getMonth();
    while(y < ey || (y === ey && m <= em)){
      months.push({y:y, m:m+1, date:new Date(y, m, 1)});
      m++; if(m > 11){ m = 0; y++; }
    }
    function gridlinesHTML(){
      var h = '<div class="gridlines">';
      months.forEach(function(mo){
        var p = pct(mo.date);
        if(p >= 0 && p <= 100) h += '<i style="left:'+p+'%"></i>';
      });
      return h + '</div>';
    }
    function todayLineHTML(withTag){
      if(!todayIn) return '';
      return '<div class="today-line" style="left:'+todayPct+'%"></div>' +
        (withTag ? '<div class="today-tag" style="left:'+todayPct+'%">'+esc(meta.legendTodayLabel)+'</div>' : '');
    }

    // Sections in payload order; empty sections are skipped.
    var sections = meta.sections.filter(function(sec){
      return tasks.some(function(t){ return t.section === sec.id; });
    });
    function sectionTasks(id){
      return tasks.filter(function(t){ return t.section === id; }).sort(function(a, b){
        return a.start < b.start ? -1 : (a.start > b.start ? 1 : 0);
      });
    }

    var html = '';
    // Header
    html += '<div class="topbar"><div><h1>'+esc(meta.title)+'</h1><div class="subtitle">'+esc(meta.subtitle)+'</div></div>';
    if(meta.dataAsOf){
      html += '<div class="snapshot"><i></i>'+esc(meta.snapshotLabel)+' <span>· '+esc(fmtCN(meta.dataAsOf))+'</span></div>';
    }
    html += '</div>';
    // Key cards
    if(meta.keys && meta.keys.length){
      html += '<div class="keys">';
      meta.keys.forEach(function(k){
        html += '<div class="key"><div class="num">'+esc(k.num)+'</div><b>'+esc(k.title)+'</b><p>'+esc(k.text)+'</p></div>';
      });
      html += '</div>';
    }
    // Legend
    html += '<div class="legend">';
    sections.forEach(function(sec){
      html += '<div class="legend-item"><span class="swatch '+esc(sec.color)+'"></span>'+esc(sec.label)+'</div>';
    });
    html += '<div class="legend-item"><span class="diamond blue"></span>'+esc(meta.legendNodeLabel)+'</div>';
    if(todayIn){
      html += '<div class="today-key"><span class="today-line-sample"></span>'+esc(meta.legendTodayLabel)+' · '+esc(fmtCN(isoOf(today)))+'</div>';
    }
    html += '</div>';
    // Gantt card
    html += '<div class="card"><div class="card-head"><strong>'+esc(meta.cardTitlePrefix)+' · '+esc(monthYear(axisStart))+' — '+esc(monthYear(axisEnd))+'</strong><span>'+esc(meta.cardHeadNote)+'</span></div>';
    html += '<div class="scroll"><div class="gantt">';
    // Axis
    html += '<div class="axis"><div class="axis-left">'+esc(meta.axisLabel)+'</div><div class="axis-track">';
    months.forEach(function(mo, idx){
      var left = pct(mo.date);
      var next = idx+1 < months.length ? pct(months[idx+1].date) : 100;
      var l = Math.max(left, 0), w = Math.min(next, 100) - l;
      if(w <= 0) return;
      var sub = (mo.m === 1 || idx === 0) ? mo.y+'年' : '';
      html += '<div class="month'+((mo.m===1||idx===0)?' major':'')+'" style="left:'+l+'%;width:'+w+'%"><b>'+mo.m+'月</b><span>'+sub+'</span></div>';
    });
    html += '</div></div>';
    // Groups and rows
    var firstRow = true;
    sections.forEach(function(sec){
      var items = sectionTasks(sec.id);
      var secVoid = items.every(function(t){ return t.status === 'void'; });
      html += '<div class="group-head'+(secVoid?' void':'')+'"><div class="group-label"><span class="dot '+esc(sec.color)+'"></span>'+esc(sec.label)+' <small>· '+items.length+' '+esc(meta.itemUnit)+'</small>'+(secVoid?' <span class="status-tag">'+esc(meta.statusLabels.void)+'</span>':'')+'</div><div class="group-track">'+gridlinesHTML()+todayLineHTML(false)+'</div></div>';
      items.forEach(function(item){
        var s = parseDate(item.start);
        var e = item.kind === 'node' ? s : parseDate(item.end);
        var left = pct(s);
        var width = Math.max(pct(e)-left + (1/TOTAL*100), 1.2);
        var tag = '';
        if(item.status && item.status !== 'todo' && meta.statusLabels[item.status]){
          tag = ' <span class="status-tag">'+esc(meta.statusLabels[item.status])+'</span>';
        }
        html += '<div class="row'+(item.status==='void'?' void':'')+'"><div class="row-info"><div class="row-title">'+esc(item.name)+tag+'</div>';
        if(item.kind === 'node'){
          html += '<div class="row-dates">'+esc(fmtSlash(item.start))+' · '+esc(meta.nodeSuffix)+'</div>';
        } else {
          html += '<div class="row-dates">'+esc(fmtSlash(item.start))+' — '+esc(fmtSlash(item.end))+'</div>';
        }
        if(item.note) html += '<div class="row-note">'+esc(item.note)+'</div>';
        html += '</div><div class="row-track">'+gridlinesHTML()+todayLineHTML(firstRow);
        firstRow = false;
        if(item.kind === 'node'){
          html += '<div class="node '+esc(sec.color)+'" style="left:'+left+'%"></div>';
          html += '<div class="node-label" style="left:calc('+left+'% + 14px)">'+esc(fmtSlash(item.start))+'</div>';
        } else {
          if(width < 9){
            html += '<div class="bar '+esc(sec.color)+'" style="left:'+left+'%;width:'+width+'%"></div><div class="bar-label-out" style="left:calc('+(left+width)+'% )">'+esc(item.name)+'</div>';
          } else {
            html += '<div class="bar '+esc(sec.color)+'" style="left:'+left+'%;width:'+width+'%">'+(width>14?esc(item.name):'')+'</div>';
            if(width <= 14){ html += '<div class="bar-label-out" style="left:calc('+(left+width)+'% )">'+esc(item.name)+'</div>'; }
          }
        }
        html += '</div></div>';
      });
    });
    html += '</div></div></div>';
    html += '<div class="hint">'+esc(meta.hint)+'</div>';
    // Links card (only when the payload carries links)
    if(meta.links && meta.links.length){
      html += '<div class="card" style="margin-top:16px"><div class="card-head"><strong>'+esc(meta.linksTitle)+'</strong></div><ul class="links">';
      meta.links.forEach(function(l){
        html += '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.title)+'</a>';
        if(l.note) html += '<p>'+esc(l.note)+'</p>';
        html += '</li>';
      });
      html += '</ul></div>';
    }
    // Footer
    html += '<div class="footer"><p><strong>'+esc(meta.footerTitle)+'</strong>'+esc(meta.footerText)+'</p></div>';
    if(meta.dataAsOf){
      html += '<div class="meta">'+esc(meta.snapshotLabel)+' '+esc(fmtCN(meta.dataAsOf))+'</div>';
    }
    document.getElementById('wrap').innerHTML = html;
  }

  /* ---------------- Dynamic render: payloads with exam.json ----------------
     One timeline, not parallel branches. Prefix rows and suffix rows come
     from tasks.csv; the exam loop (exam -> wait -> fail? next round) is
     generated from exam.json for the chosen scenario. Suffix dates are
     chained from the final results date, never stored. Colors encode
     STATUS only (todo gray / doing blue / done green / overdue red, the
     last one derived: past end date and not marked done). The scenario
     switcher is a local preview: it never writes anything back. */
  function renderDynamic(meta, tasks, exam, viewScenario){
    var SC = meta.statusColors || {};
    var C = {
      todo: SC.todo || '#6b7280',
      doing: SC.doing || '#2563eb',
      done: SC.done || '#16a34a',
      overdue: SC.overdue || '#dc2626'
    };
    var SL = meta.statusLabels || {};
    var OVER_LABEL = SL.overdue || '延误';
    var OL = meta.outcomeLabels || {};
    var FAIL_L = OL.fail || '未过';
    var PASS_L = OL.pass || '通过';
    var TENT_L = OL.tentative || '暂定';

    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var todayIso = isoOf(today);

    function colorFor(st){ return C[st] || C.todo; }
    // Manual rows: stored status, except past-end + not done/void => overdue.
    function effStatus(row){
      var st = row.status || 'todo';
      if(st === 'done' || st === 'void') return st;
      var ref = row.kind === 'node' ? row.start : row.end;
      if(ref && ref < todayIso) return 'overdue';
      return st;
    }
    // Generated rows describe events, not work: past => done, current => doing.
    function genStatus(row){
      var ref = row.kind === 'node' ? row.start : row.end;
      if(ref < todayIso) return 'done';
      if(row.start <= todayIso && todayIso <= ref) return 'doing';
      return 'todo';
    }

    var S = viewScenario;
    if(!S || S < 1) S = exam.currentScenario || 1;
    if(S > exam.exams.length) S = exam.exams.length;

    var NUM = ['首','二','三','四','五','六'];
    var CNT = ['一','二','三','四','五','六'];
    function numName(n){ return n <= NUM.length ? NUM[n-1] : ('第'+n); }
    function numCount(n){ return n <= CNT.length ? CNT[n-1] : (''+n); }

    // Generated exam rows for scenario S: attempts 1..S-1 failed, S passed.
    var gen = [];
    for(var n = 1; n <= S; n++){
      var ex = exam.exams[n-1];
      if(n > 1){
        var prev = exam.exams[n-2];
        gen.push({section:'exam', name:numName(n-1)+'考未过·间隔期', start:prev.date, end:addDaysIso(prev.date, exam.minGapDays), kind:'bar', gen:true, note:'两次考试须间隔'+exam.minGapDays+'天'});
      }
      var tags = [];
      if(n < S) tags.push(FAIL_L); else tags.push(PASS_L);
      if(ex.tentative) tags.push(TENT_L);
      gen.push({section:'exam', name:'考试 · '+numName(n)+'考', start:ex.date, end:null, kind:'node', gen:true, note:ex.note||'', tags:tags});
      gen.push({section:'exam', name:(n===1?'等待出分':'等待'+numName(n)+'考出分'), start:ex.date, end:addDaysIso(ex.date, exam.resultWaitWeeks*7), kind:'bar', gen:true, note:exam.resultWaitNote||''});
    }

    // Suffix rows, chained from the final results date (order-independent).
    var finalResults = addDaysIso(exam.exams[S-1].date, exam.resultWaitWeeks*7);
    function findSchedule(s){ for(var i=0;i<tasks.length;i++){ if(tasks[i].schedule===s) return tasks[i]; } return null; }
    var d0 = finalResults;
    var d1 = addDaysIso(d0, exam.suffix.inviteWeeks*7);
    var d2 = addDaysIso(d1, exam.suffix.submitWeeks*7);
    var d3 = addMonthsIso(d2, exam.suffix.decisionMonths);
    var suffixRows = [];
    var invT = findSchedule('invite'), subT = findSchedule('submit'), decT = findSchedule('decision');
    if(invT) suffixRows.push({section:'suffix', name:invT.name, start:d0, end:d1, kind:'bar', status:invT.status, note:invT.note||'', id:invT.id||null, parentId:null});
    if(subT) suffixRows.push({section:'suffix', name:subT.name, start:d1, end:d2, kind:'bar', status:subT.status, note:subT.note||'', id:subT.id||null, parentId:null});
    if(decT) suffixRows.push({section:'suffix', name:decT.name, start:d2, end:d3, kind:'bar', status:decT.status, note:decT.note||'', id:decT.id||null, parentId:null});

    // Fixed rows stay in CSV order (so sub-items sit under their parents).
    function fixedRows(sec){
      var out = [];
      for(var i=0;i<tasks.length;i++){
        var t = tasks[i];
        if((!t.schedule || t.schedule==='fixed') && t.section===sec) out.push(t);
      }
      return out;
    }
    function sectionRows(sec){
      if(sec==='exam') return gen;
      if(sec==='suffix') return suffixRows;
      return fixedRows(sec);
    }

    // Indent depth from parent_id (cycle-guarded).
    var byId = {};
    tasks.forEach(function(t){ if(t.id) byId[t.id] = t; });
    function depthOf(row){
      var d = 0, cur = row, seen = {};
      while(cur && cur.parentId && byId[cur.parentId] && !seen[cur.parentId] && d < 6){
        seen[cur.parentId] = true;
        d++;
        cur = byId[cur.parentId];
      }
      return d;
    }

    // Axis over all displayed rows.
    var allRows = [];
    meta.sections.forEach(function(sec){ allRows = allRows.concat(sectionRows(sec.id)); });
    var minStart = null, maxEnd = null;
    allRows.forEach(function(t){
      var s = parseDate(t.start);
      var e = t.kind === 'node' ? s : parseDate(t.end);
      if(!minStart || s < minStart) minStart = s;
      if(!maxEnd || e > maxEnd) maxEnd = e;
    });
    var axisStart = new Date(minStart.getTime() - 7*DAY);
    var axisEnd = new Date(maxEnd.getTime() + 7*DAY);
    var TOTAL = dayDiff(axisStart, axisEnd) + 1;
    function pct(d){ return dayDiff(axisStart, d)/TOTAL*100; }

    var todayIn = today >= axisStart && today <= axisEnd;
    var todayPct = todayIn ? pct(today) : 0;

    var months = [];
    var y = axisStart.getFullYear(), m = axisStart.getMonth();
    var ey = axisEnd.getFullYear(), em = axisEnd.getMonth();
    while(y < ey || (y === ey && m <= em)){
      months.push({y:y, m:m+1, date:new Date(y, m, 1)});
      m++; if(m > 11){ m = 0; y++; }
    }
    function gridlinesHTML(){
      var h = '<div class="gridlines">';
      months.forEach(function(mo){
        var p = pct(mo.date);
        if(p >= 0 && p <= 100) h += '<i style="left:'+p+'%"></i>';
      });
      return h + '</div>';
    }
    function todayLineHTML(withTag){
      if(!todayIn) return '';
      return '<div class="today-line" style="left:'+todayPct+'%"></div>' +
        (withTag ? '<div class="today-tag" style="left:'+todayPct+'%">'+esc(meta.legendTodayLabel)+'</div>' : '');
    }

    var sections = meta.sections.filter(function(sec){
      return sectionRows(sec.id).length > 0;
    });

    var html = '';
    // Header
    html += '<div class="topbar"><div><h1>'+esc(meta.title)+'</h1><div class="subtitle">'+esc(meta.subtitle)+'</div></div>';
    if(meta.dataAsOf){
      html += '<div class="snapshot"><i></i>'+esc(meta.snapshotLabel)+' <span>· '+esc(fmtCN(meta.dataAsOf))+'</span></div>';
    }
    html += '</div>';
    // Status strip: today / in-progress / next milestone (dynamic only).
    var doingNames = [];
    allRows.forEach(function(r){
      if(!r.gen && effStatus(r) === 'doing') doingNames.push(r.name);
    });
    var nextRow = null;
    allRows.forEach(function(r){
      if(r.start >= todayIso && (!nextRow || r.start < nextRow.start)) nextRow = r;
    });
    var stripHtml = '今天 ' + esc(fmtCN(todayIso)) + ' · 进行中：' + esc(doingNames.length ? doingNames.join('、') : '暂无') + ' · 下一个：';
    if(nextRow){
      var ndays = dayDiff(today, parseDate(nextRow.start));
      stripHtml += esc(nextRow.name) + ' ' + esc(fmtCN(nextRow.start)) + '（' + (ndays === 0 ? '今天' : ndays + ' 天后') + '）';
    } else {
      stripHtml += '暂无';
    }
    html += '<div class="strip">' + stripHtml + '</div>';
    // Key cards
    if(meta.keys && meta.keys.length){
      html += '<div class="keys">';
      meta.keys.forEach(function(k){
        html += '<div class="key"><div class="num">'+esc(k.num)+'</div><b>'+esc(k.title)+'</b><p>'+esc(k.text)+'</p></div>';
      });
      html += '</div>';
    }
    // Legend: colors encode STATUS now, not sections.
    html += '<div class="legend">';
    [['todo', SL.todo || '待办'], ['doing', SL.doing || '进行中'], ['done', SL.done || '已完成'], ['overdue', OVER_LABEL]].forEach(function(pair){
      html += '<div class="legend-item"><span class="swatch" style="background:'+colorFor(pair[0])+'"></span>'+esc(pair[1])+'</div>';
    });
    html += '<div class="legend-item"><span class="diamond" style="background:transparent;border-color:var(--muted)"></span>'+esc(meta.legendNodeLabel)+'</div>';
    if(todayIn){
      html += '<div class="today-key"><span class="today-line-sample"></span>'+esc(meta.legendTodayLabel)+' · '+esc(fmtCN(todayIso))+'</div>';
    }
    html += '</div>';
    // Scenario switcher (preview only).
    html += '<div class="scenario"><span class="scenario-label">'+esc(meta.scenarioLabel || '假设第几次通过')+'</span>';
    for(var i = 1; i <= exam.exams.length; i++){
      var lbl = i <= CNT.length ? CNT[i-1]+'次通过' : '第'+i+'次通过';
      html += '<button class="sc-btn'+(i===S?' active':'')+'" data-s="'+i+'">'+esc(lbl)+'</button>';
    }
    html += '<span class="scenario-note">当前显示：第 '+S+' 次通过的情形 · '+esc(meta.scenarioHint || '切换只影响本次查看')+'</span></div>';
    // Gantt card
    html += '<div class="card"><div class="card-head"><strong>'+esc(meta.cardTitlePrefix)+' · '+esc(monthYear(axisStart))+' — '+esc(monthYear(axisEnd))+'</strong><span>'+esc(meta.cardHeadNote)+'</span></div>';
    html += '<div class="scroll"><div class="gantt">';
    // Axis
    html += '<div class="axis"><div class="axis-left">'+esc(meta.axisLabel)+'</div><div class="axis-track">';
    months.forEach(function(mo, idx){
      var left = pct(mo.date);
      var next = idx+1 < months.length ? pct(months[idx+1].date) : 100;
      var l = Math.max(left, 0), w = Math.min(next, 100) - l;
      if(w <= 0) return;
      var sub = (mo.m === 1 || idx === 0) ? mo.y+'年' : '';
      html += '<div class="month'+((mo.m===1||idx===0)?' major':'')+'" style="left:'+l+'%;width:'+w+'%"><b>'+mo.m+'月</b><span>'+sub+'</span></div>';
    });
    html += '</div></div>';
    // Groups and rows
    var firstRow = true;
    sections.forEach(function(sec){
      var items = sectionRows(sec.id);
      var manual = items.filter(function(t){ return !t.gen; });
      var secVoid = manual.length > 0 && manual.every(function(t){ return effStatus(t) === 'void'; });
      html += '<div class="group-head'+(secVoid?' void':'')+'"><div class="group-label">'+esc(sec.label)+' <small>· '+items.length+' '+esc(meta.itemUnit)+'</small>'+(secVoid?' <span class="status-tag">'+esc(SL.void || '已作废')+'</span>':'')+'</div><div class="group-track">'+gridlinesHTML()+todayLineHTML(false)+'</div></div>';
      if(sec.id === 'exam' && exam.registrationNote){
        html += '<div class="group-note">'+esc(exam.registrationNote)+'</div>';
      }
      items.forEach(function(item){
        var st = item.gen ? genStatus(item) : effStatus(item);
        var col = colorFor(st);
        var s = parseDate(item.start);
        var e = item.kind === 'node' ? s : parseDate(item.end);
        var left = pct(s);
        var width = Math.max(pct(e)-left + (1/TOTAL*100), 1.2);
        var tag = '';
        if(item.gen){
          (item.tags||[]).forEach(function(tg){ tag += ' <span class="status-tag">'+esc(tg)+'</span>'; });
        } else if(st !== 'todo'){
          var lbl = st === 'overdue' ? OVER_LABEL : (SL[st] || st);
          tag = ' <span class="status-tag">'+esc(lbl)+'</span>';
        }
        var padLeft = 14 + depthOf(item)*22;
        html += '<div class="row'+(st==='void'?' void':'')+'"><div class="row-info" style="padding-left:'+padLeft+'px"><div class="row-title">'+esc(item.name)+tag+'</div>';
        if(item.kind === 'node'){
          html += '<div class="row-dates">'+esc(fmtSlash(item.start))+' · '+esc(meta.nodeSuffix)+'</div>';
        } else {
          html += '<div class="row-dates">'+esc(fmtSlash(item.start))+' — '+esc(fmtSlash(item.end))+'</div>';
        }
        if(item.note) html += '<div class="row-note">'+esc(item.note)+'</div>';
        html += '</div><div class="row-track">'+gridlinesHTML()+todayLineHTML(firstRow);
        firstRow = false;
        if(item.kind === 'node'){
          html += '<div class="node" style="left:'+left+'%;background:'+col+'"></div>';
          html += '<div class="node-label" style="left:calc('+left+'% + 14px)">'+esc(fmtSlash(item.start))+'</div>';
        } else {
          if(width < 9){
            html += '<div class="bar" style="left:'+left+'%;width:'+width+'%;background:'+col+'"></div><div class="bar-label-out" style="left:calc('+(left+width)+'% )">'+esc(item.name)+'</div>';
          } else {
            html += '<div class="bar" style="left:'+left+'%;width:'+width+'%;background:'+col+'">'+(width>14?esc(item.name):'')+'</div>';
            if(width <= 14){ html += '<div class="bar-label-out" style="left:calc('+(left+width)+'% )">'+esc(item.name)+'</div>'; }
          }
        }
        html += '</div></div>';
      });
    });
    html += '</div></div></div>';
    html += '<div class="hint">'+esc(meta.hint)+'</div>';
    if(meta.notes && meta.notes.length){
      html += '<div class="card" style="margin-top:16px"><div class="card-head"><strong>'+esc(meta.notesTitle || '备注')+'</strong></div><div class="notes-body">';
      meta.notes.forEach(function(nt){
        html += '<div class="note-item"><b>'+esc(nt.title)+'</b><p>'+esc(nt.text)+'</p></div>';
      });
      html += '</div></div>';
    }

    // Links card (only when the payload carries links)
    if(meta.links && meta.links.length){
      html += '<div class="card" style="margin-top:16px"><div class="card-head"><strong>'+esc(meta.linksTitle)+'</strong></div><ul class="links">';
      meta.links.forEach(function(l){
        html += '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.title)+'</a>';
        if(l.note) html += '<p>'+esc(l.note)+'</p>';
        html += '</li>';
      });
      html += '</ul></div>';
    }
    // Footer
    html += '<div class="footer"><p><strong>'+esc(meta.footerTitle)+'</strong>'+esc(meta.footerText)+'</p></div>';
    if(meta.dataAsOf){
      html += '<div class="meta">'+esc(meta.snapshotLabel)+' '+esc(fmtCN(meta.dataAsOf))+'</div>';
    }
    document.getElementById('wrap').innerHTML = html;
    // Wire the switcher buttons (local preview only).
    var btns = document.querySelectorAll('.sc-btn');
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.onclick = function(){ renderAll(parseInt(btn.getAttribute('data-s'), 10)); };
      })(btns[b]);
    }
  }

  var P_META = null, P_TASKS = null, P_EXAM = null;
  function renderAll(scenario){
    var sc = document.querySelector('.scroll');
    var sx = sc ? sc.scrollLeft : 0;
    var sy = window.scrollY || 0;
    if(P_EXAM) renderDynamic(P_META, P_TASKS, P_EXAM, scenario);
    else renderLegacy(P_META, P_TASKS);
    var sc2 = document.querySelector('.scroll');
    if(sc2) sc2.scrollLeft = sx;
    window.scrollTo(0, sy);
  }

  function load(pw, errEl){
    errEl.textContent = '正在加载…';
    fetch('./data.enc', {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('fetch');
      return r.json().catch(function(){ throw new Error('shape'); });
    }).then(function(env){
      if(!env || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string') throw new Error('shape');
      var enc = new TextEncoder();
      return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(baseKey){
        return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64ToBytes(env.salt), iterations:200000, hash:'SHA-256'}, baseKey, {name:'AES-CBC', length:256}, false, ['decrypt']);
      }).then(function(key){
        return crypto.subtle.decrypt({name:'AES-CBC', iv:b64ToBytes(env.iv)}, key, b64ToBytes(env.data));
      });
    }).then(function(plain){
      var payload;
      try { payload = JSON.parse(new TextDecoder().decode(plain)); }
      catch(e){ throw new Error('shape'); }
      if(!payload || typeof payload.meta !== 'object' || !Array.isArray(payload.tasks) || !payload.tasks.length) throw new Error('shape');
      P_META = payload.meta;
      P_TASKS = payload.tasks;
      P_EXAM = payload.exam || null;
      renderAll();
      if(payload.meta.title) document.title = payload.meta.title;
      var gate = document.getElementById('gate');
      if(gate) gate.remove();
      document.getElementById('content').style.display = 'block';
    }).catch(function(e){
      if(e && e.message === 'fetch') errEl.textContent = '数据加载失败，请重试';
      else if(e && e.message === 'shape') errEl.textContent = '数据格式不正确，请稍后再试';
      else errEl.textContent = '密码不正确，请重试';
    });
  }

  document.getElementById('go').onclick = function(){
    load(document.getElementById('pw').value, document.getElementById('err'));
  };
  document.getElementById('pw').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ document.getElementById('go').click(); }
  });
  document.getElementById('pw').focus();
})();
</script>
</body>
</html>

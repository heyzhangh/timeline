function go(){

  crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(baseKey){
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64ToBytes(PAYLOAD.salt), iterations:200000, hash:'SHA-256'}, baseKey, {name:'AES-CBC', length:256}, false, ['decrypt']);
  }).then(function(key){
    return crypto.subtle.decrypt({name:'AES-CBC', iv:b64ToBytes(PAYLOAD.iv)}, key, b64ToBytes(PAYLOAD.data));
  }).then(function(plain){
    var html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }).catch(function(){ err.textContent='密码不正确，请重试'; });
}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter'){ go(); } });
document.getElementById('pw').focus();
</script>
